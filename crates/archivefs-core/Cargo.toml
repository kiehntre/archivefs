[package]
name = "archivefs-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# Library Views manifests (crates::library_views): a per-view JSON record
# of every managed symlink, read/written wholesale on every plan/apply -
# not hand-edited by users like config.toml, so a real structured format
# suits it better than another hand-rolled parser. Already an existing,
# well-established dependency of archivefs-cli.
serde_json = "1"
log = "0.4"
libc = "0.2"
notify = "8"
sha2 = "0.11.0"
# RomM publishes MD5, SHA-1 and CRC32 checksums, so comparing against them needs
# those exact algorithms. `sha1` and `md-5` are the RustCrypto crates from the
# same family as the `sha2` already in use here - same authors, same `digest`
# traits, so this adds no new supply-chain surface beyond what is already
# trusted. CRC32 is implemented in-tree instead: it is twenty lines, and a third
# dependency for that would be worse value. None of these is used as a security
# primitive - they exist only to compare identifiers.
sha1 = "0.11.0"
md-5 = "0.11.0"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
http = "1"
url = "2"
# GameHacking.org exposes ordinary HTML rather than a supported public API.
# Keep CSS selectors isolated in one read-only provider module so layout
# repairs do not spread through matching, caching, or installation code.
scraper = { version = "0.27", default-features = false }
# Decode provider HTML according to an explicit HTTP charset without ever
# altering the original cached response bytes.
encoding_rs = "0.8"
# Two bounded, explicit uses share one entry: user-managed platform artwork,
# normalised once at import time, and RomM cover thumbnails, decoded and
# downscaled into the cache. Keeping it here rather than in the GUI is what lets
# the thumbnail cache be tested without a window.
#
# Keep the codec surface deliberately limited; the GUI only ever reads
# EmuWiz-owned PNG output. `jpeg` is here because an imported artwork file
# may be one. WebP is magic-detected and refused until its optional decoder can
# be supplied by the build.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# Xenia Canary patch files (`*.patch.toml`): parsed as bounded, generic
# TOML syntax via this crate, then mapped through our own strict,
# schema-specific validator - see patch_manager::xenia_patch_document.
# Never used to interpret or execute upstream content, only to read it.
# `display` is needed as well as `parse`: the cheat-source registry writes
# `cheat_sources.toml` back out, where the rest of the crate only reads TOML.
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# Streaming (pull-based) XML parsing for DAT/Logiqx catalogue files.
# No DTD or entity expansion support is enabled; DOCTYPE and entities
# are explicitly rejected by the parser rather than relying on the
# crate's own limits.
quick-xml = { version = "0.41", default-features = false }
# Archive Inspector (read-only ZIP listing): a small, focused, well
# established crate rather than hand-parsed ZIP structure or shelling out
# to `unzip`/`7z`. Production code only ever lists entry metadata via
# `ZipArchive::by_index_raw` - it never decompresses anything - so no
# codec feature (deflate/bzip2/lzma/zstd/aes-crypto/...) is enabled here;
# see the `[dev-dependencies]` entry below for why tests need more.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# ZIP member streams are decoded from preflight-validated packed ranges rather
# than `ZipArchive`'s name-keyed index (which collapses duplicate names).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Experimental 7z archive-member reader (POST-ALPHA-1.1, zero production
# callers). `sevenz-rust2` is the maintained fork of the (now unmaintained,
# advisory-carrying) `sevenz-rust`; it is pure Rust, Apache-2.0. The
# production build deliberately enables NO features at all
# (`default-features = false` drops upstream's default
# `aes256`/`bzip2`/`compress`/`ppmd`/`util` set): no writer (`compress`), no
# `bzip2`, no `ppmd`, no `aes256`, and — importantly — no `util`, which is
# the feature gating the `decompress*` extract-to-disk convenience helpers.
# With `util` off those functions are not even compiled into the production
# build, so the path-traversal class of defect that plagued the old crate's
# `decompress_impl` cannot be reached from here at all.
#
# Encrypted 7z headers/members therefore surface as
# `UnsupportedCompressionMethod("AES256_SHA256")` at decode time, which this
# reader maps to an explicit Encrypted refusal. `zstd`, `brotli`, `lz4`,
# `deflate`, `bzip2` and `ppmd` coders are likewise always refused.
# The 7z implementation remains inert: the production DAT audit added after
# this comment was written calls only the ZIP source.
# (see docs/research/SEVEN_Z_RAR_ARCHIVE_VERIFICATION_RESEARCH.md §12).
sevenz-rust2 = { version = "0.21.4", default-features = false }
chd = "0.3.4"
# Optional specialist optical-disc backend (crate::chd_optical_specialist),
# behind the `chd-optical-specialist` feature - see that module's own doc
# comment. Unlike `chd` above (pure Rust), this pulls in `libchdman-rs`,
# which links a native build of MAME's own `chd_file`/`cdrom_file` C++ core
# (BSD-3-Clause) - by default via a prebuilt static archive fetched at build
# time, not compiled from source. Only enabled explicitly; every other path
# in this crate (including the pure-Rust `chd_logical_media` reader) builds
# and passes its own tests with this feature off.
opticaldiscs = { version = "0.15", default-features = false, features = [
    "chd",
], optional = true }
# GameCube/Wii disc structure (game ID, disc header, partition table, FST,
# apploader, main.dol) - pure Rust, no native/C dependency with default
# features disabled. Reused rather than hand-writing a GC/Wii optical
# filesystem stack from scratch; only structural/header facts are read,
# never Wii partition decryption (no keys are available to this crate).
nod = { version = "1.4.4", default-features = false }
# Original Xbox/Xbox 360 XDVDFS filesystem - pure Rust with only `read`+`std`
# enabled (no `write`/`ciso`/`wax`/crypto features). Reused rather than
# hand-writing an XDVDFS filesystem stack from scratch.
xdvdfs = { version = "0.8.3", default-features = false, features = ["read", "std"] }

[features]
chd-optical-specialist = ["dep:opticaldiscs"]

[dev-dependencies]
# Same crate, fuller feature set: only test fixtures need to *write* 7z
# files (solid, encrypted, multi-member) to exercise the read-only reader
# against real archives. Cargo unifies features for one crate across
# `[dependencies]`/`[dev-dependencies]` only within a build that includes
# both (`cargo test`) - a plain `cargo build --release` never links the
# writer or the AES code. `default-features = false` is kept here too, so
# even the test build never compiles the `util` extract-to-disk helpers:
# only `compress` (the `ArchiveWriter`) and `aes256` (the fixture that
# writes an AES-encrypted member) are added.
sevenz-rust2 = { version = "0.21.4", default-features = false, features = [
    "compress",
    "aes256",
] }
# Same crate, fuller feature set: only test fixtures need to *write* zip
# files (including a deflated and a password-encrypted one) to exercise
# the read-only inspector against real archives. Cargo unifies features
# for one crate across `[dependencies]`/`[dev-dependencies]` only within
# a build that includes both (`cargo test`) - a plain `cargo build
# --release` (no test targets) never links any codec this crate does not
# itself need.
zip = { version = "8.6", features = ["deflate", "aes-crypto"] }
tempfile = "3"
